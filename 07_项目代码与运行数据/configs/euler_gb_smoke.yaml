# 只检查 Euler+GB 整条链路：64 窗口，VAE 和扩散各 1 步。不是正式训练。
# mixed_precision 用 no，CPU 上也能跑完这一步。正式配置是 fp16。
seed: 20261117
output_root: 08_训练与生成结果/euler_gb/smoke

data:
  image_mode: euler_gb
  manifest: /Users/masaharu/Desktop/1.材料开发/data/data/manifest.json
  compositions: data/compositions.csv
  heat_treatment: data/heat_treatment.csv
  patch_size: 64
  patches_per_image: 2
  crop_margins: [0, 0, 0, 0]
  horizontal_flip: false
  vertical_flip: false
  rotate_180: false
  num_workers: 0

composition:
  candidate_features: [Ni, Fe, Cr, Nb, Ta, Co, Mo, Al, Ti]
  closure_drop_feature: Fe
  min_nonzero_samples: 2
  min_standard_deviation: 1.0e-8
  vicinal_jitter_std: 0.05
  max_normalized_extrapolation: 3.0

euler_gb:
  phi1_degrees: 360
  Phi_degrees: 90
  phi2_degrees: 90
  phi_encoding: sincos
  boundary_threshold: 15
  boundary_max_half_width: 2
  boundary_min_component: 8
  boundary_max_local_fraction: 0.45
  boundary_local_radius: 3
  boundary_euler: fill_neighbors
  gb_loss: bce
  orientation_l1_weight: 1.0
  gb_loss_weight: 1.0
  gb_edge_weight: 0.20
vae:
  in_channels: 7
  out_channels: 7
  latent_channels: 4
  block_out_channels: [32, 64]
  layers_per_block: 1
  kl_weight: 1.0e-6
  edge_weight: 0.20

diffusion:
  block_out_channels: [32, 64]
  layers_per_block: 1
  condition_hidden_dim: 32
  condition_dropout: 0.15
  num_train_timesteps: 20
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon
  ema_decay: 0.99

train_vae:
  output_dir: 08_训练与生成结果/euler_gb/smoke/vae
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 0
  max_steps: 1
  mixed_precision: "no"
  gradient_checkpointing: false
  save_every: 100
  log_every: 1

train_diffusion:
  output_dir: 08_训练与生成结果/euler_gb/smoke/diffusion
  vae_dir: 08_训练与生成结果/euler_gb/smoke/vae/final
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 0
  max_steps: 1
  mixed_precision: "no"
  gradient_checkpointing: false
  vae_encode_batch_size: 2
  lambda_gb: 0.0
  lambda_edge: 0.0
  save_every: 100
  sample_every: 100
  log_every: 1

evaluation:
  focus_alloy_ids: [18, 17, 20, 5]
  grain_threshold_degrees: 15
  copy_stride: 32

sampling:
  num_inference_steps: 2
  guidance_scale: 1.5
  height: 64
  width: 64
  crop_height: 64
  crop_width: 64
  seeds:
    - 2026111701
    - 2026111702
