# Fold 03 ablation B': calibrated GB structure loss, from scratch.
seed: 20261017
data:
  manifest: data/manifest.csv
  compositions: data/compositions.csv
  heat_treatment: data/heat_treatment.csv
  patch_size: 256
  patches_per_image: 128
  crop_margins: [0, 0, 0, 0]
  horizontal_flip: false
  vertical_flip: false
  rotate_180: false
  num_workers: 4
composition:
  candidate_features: [Ni, Fe, Cr, Nb, Ta, Co, Mo, Al, Ti]
  closure_drop_feature: Fe
  min_nonzero_samples: 2
  min_standard_deviation: 1.0e-8
  vicinal_jitter_std: 0.05
  max_normalized_extrapolation: 3.0
vae:
  latent_channels: 4
  block_out_channels: [64, 128, 256]
  layers_per_block: 2
  kl_weight: 1.0e-6
  edge_weight: 0.20
diffusion:
  block_out_channels: [128, 256, 256]
  layers_per_block: 2
  condition_hidden_dim: 128
  condition_dropout: 0.15
  num_train_timesteps: 1000
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon
  ema_decay: 0.9999
train_diffusion:
  output_dir: 08_训练与生成结果/03_结构loss消融/Fold03_B3_gb_t150_5000
  vae_dir: 08_训练与生成结果/01_VAE模型/final
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  max_steps: 5000
  mixed_precision: fp16
  gradient_checkpointing: true
  save_every: 1000
  sample_every: 1000
  log_every: 25
  lambda_gb: 1.0
  lambda_edge: 0.0
  structure_max_t: 150
sampling:
  preview_count: 5
  final_count_per_alloy: 5
  num_inference_steps: 50
  guidance_scale: 1.8
  height: 256
  width: 256
  crop_height: 256
  crop_width: 256

