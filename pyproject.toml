[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ebsd-conditional-diffusion"
version = "0.1.0"
description = "Composition-conditioned latent diffusion for RGB IPF+GB microstructure images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "diffusers>=0.35,<1",
  "accelerate>=1.7,<2",
  "safetensors>=0.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "Pillow>=10.4",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "scikit-image>=0.24",
  "tqdm>=4.66",
  "tensorboard>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["ebsd_diffusion*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

